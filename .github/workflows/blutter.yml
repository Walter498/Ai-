name: blutter-analyze
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: worawit/blutter
          path: blutter
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libicu-dev libcapstone-dev python3 python3-requests git clang
      - name: Run blutter
        run: |
          cd blutter
          python3 blutter.py ../analysis ../out --rebuild 2>&1 | tail -40
      - name: Commit output back
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          mkdir -p blutter_out
          cp -r out/* blutter_out/ 2>/dev/null || true
          git add blutter_out/
          git commit -m 'blutter output [skip ci]' || echo 'no changes'
          git push
