name: blutter-analyze
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: worawit/blutter
          path: blutter
      - name: All-in-one (install + run, full log)
        run: |
          exec > >(tee full.log) 2>&1
          set -x
          which python3; python3 -V
          python3 -m pip --version || (sudo apt-get update && sudo apt-get install -y python3-pip)
          python3 -m pip install --break-system-packages pyelftools capstone requests
          python3 -c "import elftools, capstone; print('deps OK')"
          sudo apt-get update || true
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libicu-dev libcapstone-dev clang || true
          cd blutter
          python3 blutter.py ../analysis ../out --rebuild || true
      - name: Commit everything
        if: always()
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          mkdir -p blutter_out
          cp -r out/* blutter_out/ 2>/dev/null || true
          cp full.log blutter_out/ 2>/dev/null || true
          git add blutter_out/
          git commit -m 'blutter run [skip ci]' || echo 'no changes'
          git push
